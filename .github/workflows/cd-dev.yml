name: CD · Deploy to Dev



on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

# Never run two dev deploys at once; let an in-flight deploy finish.
concurrency:
  group: cd-dev
  cancel-in-progress: false

jobs:
  
  validate:
    name: Pre-flight checks
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required secrets & variables
        env:
          EC2_DEV_HOST: ${{ secrets.EC2_DEV_HOST }}
          EC2_DEV_USER: ${{ secrets.EC2_DEV_USER }}
          EC2_DEV_SSH_KEY: ${{ secrets.EC2_DEV_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          missing=()
          [ -z "$EC2_DEV_HOST" ]         && missing+=("secret EC2_DEV_HOST")
          [ -z "$EC2_DEV_USER" ]         && missing+=("var EC2_DEV_USER")
          [ -z "$EC2_DEV_SSH_KEY" ]      && missing+=("secret EC2_DEV_SSH_KEY")
          [ -z "$DOCKERHUB_USERNAME" ]   && missing+=("secret DOCKERHUB_USERNAME")
          [ -z "$DOCKERHUB_TOKEN" ]      && missing+=("secret DOCKERHUB_TOKEN")
          [ -z "$CLOUDINARY_CLOUD_NAME" ] && missing+=("secret CLOUDINARY_CLOUD_NAME")
          [ -z "$CLOUDINARY_API_KEY" ]    && missing+=("secret CLOUDINARY_API_KEY")
          [ -z "$CLOUDINARY_API_SECRET" ] && missing+=("secret CLOUDINARY_API_SECRET")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing required CD config: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "✅ All required deploy config is present."

  # --------------------------------------------------------------------------
  # Deploy: ship the compose file and bring the stack up from the pushed images.
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    steps:
      # Grab ONLY the compose file, at the exact commit CI just validated.
      - name: Checkout compose file
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: docker-compose-dev.yml
          sparse-checkout-cone-mode: false

      # Copy just that one file to the EC2 (no source code).
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: docker-compose-dev.yml
          target: ${{ secrets.EC2_DEV_APP_DIR || 'communityboard' }}

      # SSH in: sed the registry in, log in to Docker Hub, pull the :dev images
      # and (re)start the stack.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APP_DIR: ${{ secrets.EC2_DEV_APP_DIR || 'communityboard' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_DEV_USER }}
          key: ${{ secrets.EC2_DEV_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,APP_DIR,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET
          script: |
            set -euo pipefail
            # Bash does NOT expand a leading ~ from a variable, so do it ourselves.
            APP_DIR="${APP_DIR/#\~/$HOME}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Inject the Docker Hub namespace into the image references.
            # (Safe to sed: a Docker Hub namespace has no sed-special chars.)
            sed -i "s#__REGISTRY__#${DOCKERHUB_USERNAME}#g" docker-compose-dev.yml
            echo "----- image references -----"
            grep 'image:' docker-compose-dev.yml

            # Write the Cloudinary credentials to .env (mode 600) for compose to
            # substitute. Done with a here-doc, NOT sed, so any special chars in
            # the secret are written verbatim and never appear in the command log.
            umask 077
            cat > .env <<EOF
            CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
            CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
            CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
            EOF
            echo "----- .env keys written (values hidden) -----"
            cut -d= -f1 .env

            # Authenticate so the pull works for private repos.
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Pull the freshly pushed :dev images and roll the stack.
            docker compose -f docker-compose-dev.yml pull
            docker compose -f docker-compose-dev.yml up -d

            docker logout || true
            docker image prune -f || true
            docker compose -f docker-compose-dev.yml ps
