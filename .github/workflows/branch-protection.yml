name: Branch Protection (as code)

# Applies branch protection rules to dev, test and main from version-controlled config.
#
# WHY a workflow: branch protection is a server-side setting. Configuring it by hand
# in the UI is not reproducible and drifts over time. This workflow makes the rules
# code: review them in PRs, re-apply them on demand, and keep every branch consistent.
#
# Branching model enforced here:   feature -> dev -> test -> main
#   - No direct pushes to dev / test / main for the TEAM (changes via Pull Request).
#   - MERGE POLICY:
#       * dev        -> any team member may merge their own reviewed, green PR.
#       * test, main -> ONLY REPO ADMINS may merge. Team members can open PRs into
#                       them, but the final merge is admin-only.
#     This is enforced with an empty push-restriction list on test/main: admins
#     bypass push restrictions, everyone else is blocked from the merge/push.
#     (enforce_admins stays false so admins remain the gatekeepers of test/main.)
#   - Every PR needs at least 1 approving review.
#   - CI gate: the "PR Gate" status check (.github/workflows/pr-checks.yml) is now
#     REQUIRED on all three branches — a PR cannot merge until it is green.
#   - NOTE: admins-only merge relies on branch push restrictions, which GitHub
#     supports only on ORG-OWNED repos. This repo is org-owned
#     (AmaliTech-Training-Academy), so it is supported.
#
# REQUIREMENT: the default GITHUB_TOKEN cannot edit branch protection.
# Create a fine-grained or classic PAT with "Administration: write" (repo admin) on
# this repo and add it as a repository secret named BRANCH_PROTECTION_TOKEN.

on:
  # Run manually whenever you want to (re)apply the rules.
  workflow_dispatch:
  # Auto re-apply when the rules themselves change on main.
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-protection.yml"

permissions:
  contents: read

jobs:
  ensure-branches:
    name: Ensure branches exist (main/dev/test)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create missing branches (if any)
        env:
          # Use the built-in token for git ref creation; the PAT is only needed for branch protection.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"

          DEFAULT_BRANCH="$(gh api -H "Accept: application/vnd.github+json" "/repos/$REPO" -q .default_branch)"
          echo "Repo default branch: $DEFAULT_BRANCH"

          DEFAULT_SHA="$(gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/git/ref/heads/$DEFAULT_BRANCH" -q .object.sha)"
          echo "Default branch SHA: $DEFAULT_SHA"

          branch_exists() {
            local b="$1"
            gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/branches/$b" >/dev/null 2>&1
          }

          create_branch_from_sha() {
            local b="$1"
            local sha="$2"
            echo "Creating branch '$b' from $sha..."
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/git/refs" \
              -f "ref=refs/heads/$b" \
              -f "sha=$sha" >/dev/null
            echo "✅ Created '$b'"
          }

          # Ensure main exists (some repos still start with 'master' or another default).
          if branch_exists "main"; then
            echo "Branch 'main' exists."
          else
            create_branch_from_sha "main" "$DEFAULT_SHA"
          fi

          # Prefer creating dev/test from main; fall back to default branch SHA.
          if branch_exists "main"; then
            MAIN_SHA="$(gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/git/ref/heads/main" -q .object.sha)"
          else
            MAIN_SHA="$DEFAULT_SHA"
          fi

          for BR in dev test; do
            if branch_exists "$BR"; then
              echo "Branch '$BR' exists."
            else
              create_branch_from_sha "$BR" "$MAIN_SHA"
            fi
          done

  apply:
    name: Apply protection to ${{ matrix.branch }}
    runs-on: ubuntu-latest
    needs: ensure-branches
    strategy:
      fail-fast: false
      matrix:
        branch: [dev, test, main]

    steps:
      - name: Validate admin token is present
        env:
          ADMIN_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::Secret BRANCH_PROTECTION_TOKEN is not set. Create a PAT with 'Administration: write' and add it as a repo secret."
            exit 1
          fi

      - name: Build protection rules for ${{ matrix.branch }}
        id: rules
        run: |
          BRANCH="${{ matrix.branch }}"

          REQUIRED_REVIEWS=1

          # CI gate now exists (.github/workflows/pr-checks.yml -> "PR Gate" check),
          # so require it on every protected branch. strict=false avoids forcing a
          # rebase when the base branch moves; the check itself must still be green.
          STATUS_CHECKS='{ "strict": false, "contexts": ["PR Gate"] }'

          # MERGE POLICY via push restrictions (org-owned repo only):
          #   - dev:        restrictions=null  -> any team member can merge a reviewed PR.
          #   - test/main:  empty restriction list -> only repo ADMINS can merge.
          #                 Admins bypass push restrictions; everyone else is blocked
          #                 from the final merge/push. Non-admins can still OPEN PRs.
          if [ "$BRANCH" = "dev" ]; then
            RESTRICTIONS="null"
            MERGE_POLICY="Any team member may merge reviewed PRs"
          else
            RESTRICTIONS='{ "users": [], "teams": [], "apps": [] }'
            MERGE_POLICY="Admins only (push-restricted)"
          fi
          echo "MERGE_POLICY=$MERGE_POLICY" >> "$GITHUB_ENV"

          # enforce_admins=false: admins remain the gatekeepers of test/main (they
          # bypass the empty restriction list to perform the merge). Setting it true
          # here would deadlock test/main — nobody could ever merge.
          cat > rules.json <<EOF
          {
            "required_status_checks": ${STATUS_CHECKS},
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": true,
              "required_approving_review_count": ${REQUIRED_REVIEWS}
            },
            "required_linear_history": false,
            "required_conversation_resolution": false,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "restrictions": ${RESTRICTIONS}
          }
          EOF

          echo "Computed rules for $BRANCH:"
          cat rules.json

      - name: Apply protection via GitHub API
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          BRANCH="${{ matrix.branch }}"
          echo "Applying branch protection to '$BRANCH'..."
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/branches/${BRANCH}/protection" \
            --input rules.json
          echo "✅ Protection applied to '$BRANCH'."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Branch protection — ${{ matrix.branch }}"
            echo ""
            echo "| Rule | Value |"
            echo "|------|-------|"
            echo "| Direct pushes (team) | ❌ blocked (PR required) |"
            echo "| Who can merge | ${MERGE_POLICY:-n/a} |"
            echo "| Approving reviews required | 1 |"
            echo "| Dismiss stale approvals | ✅ |"
            echo "| Required CI check | ✅ \`PR Gate\` |"
            echo "| Force pushes | ❌ |"
            echo "| Branch deletion | ❌ |"
          } >> "$GITHUB_STEP_SUMMARY"
