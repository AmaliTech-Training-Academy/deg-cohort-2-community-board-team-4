name: CI · QA (compose + api/ui)

# ============================================================================
# Reusable QA workflow, called by ci.yml. Brings the WHOLE application stack up
# on the runner with docker compose — so the backend/frontend are reachable on
# the agent's own localhost (8080 / 3000) — then runs the API and UI suites
# IN PARALLEL against it. Real GATE: a failing suite fails the pipeline.
#
# The two suites run concurrently against a single shared stack (one compose
# boot, maximum time saving) rather than spinning the stack up twice.
#
# PREREQUISITE: `docker compose up --build` builds every service from source,
# including ./data-engineering. Its Dockerfile currently `COPY requirements.txt`
# but the project migrated to uv (pyproject.toml + uv.lock) and has no
# requirements.txt — that build will FAIL until the Dockerfile is updated.
# See devops/ci/README.md.
# ============================================================================

on:
  workflow_call: {}

permissions:
  contents: read

# QA is heavy (full compose stack on the runner). Only one QA run per branch at
# a time; a newer push supersedes it. Distinct group from the orchestrator
# (ci-<ref>) to avoid a caller/callee deadlock.
concurrency:
  group: ci-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: API + UI (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (QA suites are Maven/TestNG)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Buildx + layer caching keeps the compose build fast on repeat runs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start the stack
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for backend (http://localhost:8080)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/posts >/dev/null 2>&1 \
               || curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "backend ready"; exit 0
            fi
            sleep 5
          done
          echo "::error::backend did not become ready in time"
          docker compose -f docker-compose.yml logs --tail=200
          exit 1

      - name: Wait for frontend (http://localhost:3000)
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then
              echo "frontend ready"; exit 0
            fi
            sleep 5
          done
          echo "::error::frontend did not become ready in time"
          docker compose -f docker-compose.yml logs --tail=200 frontend
          exit 1

      # Run both Maven test suites at once. Capture each exit code and fail the
      # step if either suite failed, after printing both logs.
      - name: Run API + UI tests in parallel
        run: |
          set +e
          ( cd qa/api-tests && mvn -B test ) > api-tests.log 2>&1 &
          api_pid=$!
          ( cd qa/ui-tests  && mvn -B test ) > ui-tests.log 2>&1 &
          ui_pid=$!

          wait $api_pid; api_rc=$?
          wait $ui_pid;  ui_rc=$?

          echo "::group::API test output"; cat api-tests.log; echo "::endgroup::"
          echo "::group::UI test output";  cat ui-tests.log;  echo "::endgroup::"
          echo "API suite exit=$api_rc | UI suite exit=$ui_rc"

          [ $api_rc -eq 0 ] && [ $ui_rc -eq 0 ]

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=300

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: |
            api-tests.log
            ui-tests.log
            qa/api-tests/target/surefire-reports/**
            qa/ui-tests/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
