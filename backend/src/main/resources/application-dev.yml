spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/communityboard_dev}
    username: ${SPRING_DATASOURCE_USERNAME:ally}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET:communityboard-secret-key-amalitech-2024}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400}    # seconds (1 day)
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800} # seconds (7 days)

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
