spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/communityboard}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  secret: ${JWT_SECRET:communityboard-secret-key-amalitech-2024}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400}    # seconds (1 day)
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800} # seconds (7 days)

server:
  port: 8080

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  upload-folder: ${CLOUDINARY_UPLOAD_FOLDER:community-board/posts}
  placeholder-url: ${CLOUDINARY_PLACEHOLDER_URL:https://res.cloudinary.com/demo/image/upload/v1/community-board/placeholder.png}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
