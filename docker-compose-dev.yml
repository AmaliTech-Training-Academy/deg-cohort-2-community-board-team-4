# Pull-based compose for the DEV EC2 host.
#
# Deployed by .github/workflows/cd-dev.yml: that workflow copies ONLY this file
# to the box (no source code) and runs `sed` on it to replace __REGISTRY__ with
# the Docker Hub namespace, then `docker compose pull && up -d`.
#
# Images are PULLED (never built here) at the :dev tag that CI pushed.
# Dev env values are STATIC dummy values — NOT for production.
version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: communityboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d communityboard"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: __REGISTRY__/communityboard-backend:dev
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/communityboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: communityboard-secret-key-amalitech-2024
      # Cloudinary (post image uploads). The three credentials are injected by
      # cd-dev.yml from GitHub Actions secrets — NOT committed here. The two
      # overrides below are non-sensitive and static for dev.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_UPLOAD_FOLDER: community-board/posts
      CLOUDINARY_PLACEHOLDER_URL: https://res.cloudinary.com/demo/image/upload/v1/community-board/placeholder.png
    # Backend binds :8080 only after the Spring context (incl. Flyway) is ready,
    # so a 200 here means the schema exists. /api-docs is permitAll, no auth.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: __REGISTRY__/communityboard-frontend:dev
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  data-engineering:
    image: __REGISTRY__/communityboard-data-engineering:dev
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: communityboard
      DB_USER: postgres
      DB_PASSWORD: postgres
      APP_ENV: development
      RUN_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
