# SonarQube / SonarCloud multi-module configuration (STUB — not active yet).
# See devops/sonar/README.md for how to enable it in the pipeline.

sonar.projectKey=communityboard
sonar.projectName=CommunityBoard
# For SonarCloud only, also set:
# sonar.organization=<your-org-key>

# Analyse the three app areas as one project, split into modules.
sonar.modules=backend,frontend,data-engineering

# --- Java backend (Spring Boot / Maven) ---
backend.sonar.projectName=backend
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.binaries=target/classes
backend.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Angular frontend ---
frontend.sonar.projectName=frontend
frontend.sonar.sources=src
frontend.sonar.tests=src
frontend.sonar.test.inclusions=**/*.spec.ts
frontend.sonar.exclusions=**/node_modules/**,**/dist/**
frontend.sonar.javascript.lcov.reportPaths=coverage/community-board-ui/lcov.info

# --- Python data-engineering (uv) ---
data-engineering.sonar.projectName=data-engineering
data-engineering.sonar.sources=.
data-engineering.sonar.tests=tests
# tests/** excluded from MAIN sources so test files aren't indexed as both
# source and test (sources=. already covers tests/). They are still analysed
# as tests via sonar.tests=tests above.
data-engineering.sonar.exclusions=**/.venv/**,**/__pycache__/**,tests/**
data-engineering.sonar.python.version=3.11
data-engineering.sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
