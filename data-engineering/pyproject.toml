[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "communityboard-etl"
version = "1.0.0"
description = "ETL Pipeline for CommunityBoard Analytics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Mbarndouka", email = "marius.oumarou@amalitech.com"}
]
keywords = ["etl", "analytics", "data-engineering"]
dependencies = [
    "pandas>=2.1.3",
    "sqlalchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "faker>=22.0.0",
    "pre-commit>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.8",
]
prod = [
    "gunicorn>=21.2.0",
]

[tool.setuptools]
packages = ["config", "utils"]

[tool.setuptools.package-data]
config = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"
